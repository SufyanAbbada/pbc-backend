name: Test Validity of Published Image

on:
  workflow_run:
    workflows:
      - Publish Backend Image from Code to Docker Hub
    types:
      - completed
    branches:
      - main

jobs:
  test_published_images_validity:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      IMAGE: muhammadarslanrevoech/pbc-api:sha-${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Authenticate with Docker Again
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Pull Image from Docker
        run: |
          echo "Pulling Image: $IMAGE"
          docker pull "$IMAGE"
          echo "Image $IMAGE pulled"

      - name: Start backend container from the pulled Image
        run: |
          echo "Running the Container"
          docker run \
            --detach \
            --name pbc-api-check \
            --publish 127.0.0.1:3000:3000 \
            --env PORT=3000 \
            --env NODE_ENV=test \
            --env TWILIO_ENABLED=false \
            --env SENDGRID_ENABLED=false \
            "$IMAGE"

      - name: Wait for API and check its response
        timeout-minutes: 2
        run: |
          for attempt in {1..15}; do
            echo "Checking API: attempt $attempt of 15"

            if curl --fail --silent --show-error --max-time 2 \
              --output api-response.json \
              http://127.0.0.1:3000/api/; then

              cat api-response.json
              jq -e '.message == "API is working Fine!"' api-response.json

              echo "API response verified"
              exit 0
            fi

            sleep 2
          done

          echo "API did not become ready"
          exit 1

      - name: Show container logs if a step failed
        if: ${{ failure() }}
        run: |
          docker ps -a
          docker logs pbc-api-check || true

      - name: Remove the test container
        if: ${{ always() }}
        run: docker rm --force pbc-api-check || true
