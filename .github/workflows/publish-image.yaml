name: Publish Backend Image from Code to Docker Hub

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download Latest main Push commit Code
        uses: actions/checkout@v6

      - name: Authenticate with Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and Publish Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: muhammadarslanrevoech/pbc-api:sha-${{ github.sha }}
